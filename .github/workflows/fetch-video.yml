name: fetch-video
on:
  push:
    branches: [fetch-video]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, 'video file')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sf -o comm.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3F43ZzSvlbKfBvgAVATL9VYSwda/hf_20261128_063921_458b6e32-6e6f-4739-8ce9-edd07a1891ec.wav"
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add comm.mp4 && git commit -m "video file" && git push
