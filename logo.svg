<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="irisGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#7eefc4"/>
      <stop offset="40%" stop-color="#3CB371"/>
      <stop offset="100%" stop-color="#1a5c38"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <clipPath id="eyeClip">
      <path d="M 110,205 C 160,135 340,135 390,205 C 340,275 160,275 110,205 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <rect width="500" height="500" fill="url(#dots)"/>

  <!-- ── EYE MARK ── centered at 250,205 -->

  <!-- Outer glow ring — very subtle -->
  <ellipse cx="250" cy="205" rx="98" ry="38" fill="none" stroke="rgba(60,179,113,0.12)" stroke-width="1"/>

  <!-- Eye fill (white of eye) -->
  <path d="M 110,205 C 160,135 340,135 390,205 C 340,275 160,275 110,205 Z"
    fill="#030f07"/>

  <!-- Iris base -->
  <circle cx="250" cy="205" r="52" fill="url(#irisGrad)"/>

  <!-- Iris inner ring -->
  <circle cx="250" cy="205" r="52" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>

  <!-- Iris texture lines (radial) -->
  <g clip-path="url(#eyeClip)" opacity="0.18" stroke="#fff" stroke-width="0.6">
    <line x1="250" y1="153" x2="250" y2="257"/>
    <line x1="198" y1="157" x2="302" y2="253"/>
    <line x1="156" y1="175" x2="344" y2="235"/>
    <line x1="302" y1="157" x2="198" y2="253"/>
    <line x1="344" y1="175" x2="156" y2="235"/>
  </g>

  <!-- Pupil -->
  <circle cx="250" cy="205" r="22" fill="#000"/>

  <!-- Gold corneal highlight (main) -->
  <circle cx="265" cy="191" r="8" fill="#F5BD02" opacity="0.95"/>

  <!-- Gold highlight inner white -->
  <circle cx="267" cy="189" r="3.5" fill="#fff" opacity="0.75"/>

  <!-- Small secondary highlight -->
  <circle cx="244" cy="216" r="3" fill="rgba(255,255,255,0.18)"/>

  <!-- Eye outline — emerald, clean -->
  <path d="M 110,205 C 160,135 340,135 390,205 C 340,275 160,275 110,205 Z"
    fill="none" stroke="#3CB371" stroke-width="2.2"/>

  <!-- Upper lid inner edge — subtle depth -->
  <path d="M 130,205 C 175,155 325,155 370,205"
    fill="none" stroke="rgba(60,179,113,0.18)" stroke-width="1"/>

  <!-- Corner detail — left -->
  <circle cx="110" cy="205" r="3.5" fill="#3CB371" opacity="0.7"/>
  <!-- Corner detail — right -->
  <circle cx="390" cy="205" r="3.5" fill="#3CB371" opacity="0.7"/>

  <!-- ── DIVIDER ── -->
  <line x1="140" y1="318" x2="360" y2="318" stroke="rgba(60,179,113,0.25)" stroke-width="0.8"/>

  <!-- ── WORDMARK ── -->
  <text
    x="250" y="354"
    font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif"
    font-size="38"
    font-weight="600"
    letter-spacing="7"
    fill="#ffffff"
    text-anchor="middle">PIXEL VISION</text>

</svg>
