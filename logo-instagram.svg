<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ig-irisGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#7eefc4"/>
      <stop offset="40%" stop-color="#3CB371"/>
      <stop offset="100%" stop-color="#1a5c38"/>
    </radialGradient>
    <radialGradient id="ig-bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <pattern id="ig-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <clipPath id="ig-eyeClip">
      <path d="M 170,420 C 270,270 730,270 830,420 C 730,570 270,570 170,420 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#ig-bgGrad)"/>
  <rect width="1000" height="1000" fill="url(#ig-dots)"/>

  <!-- Subtle outer ring -->
  <circle cx="500" cy="420" r="300" fill="none" stroke="rgba(60,179,113,0.04)" stroke-width="1"/>

  <!-- ── EYE MARK ── centered at 500,420 -->

  <!-- Eye fill -->
  <path d="M 170,420 C 270,270 730,270 830,420 C 730,570 270,570 170,420 Z"
    fill="#020c05"/>

  <!-- Iris -->
  <circle cx="500" cy="420" r="108" fill="url(#ig-irisGrad)"/>
  <circle cx="500" cy="420" r="108" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="5"/>

  <!-- Iris lines -->
  <g clip-path="url(#ig-eyeClip)" opacity="0.15" stroke="#fff" stroke-width="1.2">
    <line x1="500" y1="312" x2="500" y2="528"/>
    <line x1="392" y1="318" x2="608" y2="522"/>
    <line x1="310" y1="362" x2="690" y2="478"/>
    <line x1="608" y1="318" x2="392" y2="522"/>
    <line x1="690" y1="362" x2="310" y2="478"/>
  </g>

  <!-- Pupil -->
  <circle cx="500" cy="420" r="45" fill="#000"/>

  <!-- Gold highlight -->
  <circle cx="533" cy="387" r="17" fill="#F5BD02" opacity="0.95"/>
  <circle cx="537" cy="383" r="7" fill="#fff" opacity="0.72"/>
  <circle cx="484" cy="438" r="6" fill="rgba(255,255,255,0.14)"/>

  <!-- Eye outline -->
  <path d="M 170,420 C 270,270 730,270 830,420 C 730,570 270,570 170,420 Z"
    fill="none" stroke="#3CB371" stroke-width="4.5"/>

  <!-- Inner upper lid -->
  <path d="M 220,420 C 310,310 690,310 780,420"
    fill="none" stroke="rgba(60,179,113,0.14)" stroke-width="2"/>

  <!-- Corner dots -->
  <circle cx="170" cy="420" r="7" fill="#3CB371" opacity="0.65"/>
  <circle cx="830" cy="420" r="7" fill="#3CB371" opacity="0.65"/>

  <!-- ── DIVIDER ── -->
  <line x1="240" y1="650" x2="760" y2="650" stroke="rgba(60,179,113,0.28)" stroke-width="1.5"/>

  <!-- ── WORDMARK ── -->
  <text
    x="500" y="730"
    font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif"
    font-size="80"
    font-weight="600"
    letter-spacing="14"
    fill="#ffffff"
    text-anchor="middle">PIXEL VISION</text>

</svg>
